<!DOCTYPE html>
<html>
<head>
  <title>Cart - Amazon Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>amazon<span>.clone</span></h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html" class="active">Cart</a>
  </nav>
</header>

<main>
  <section class="cart-section">
    <h2>Your Cart</h2>

    <!-- Cart Items -->
    <div class="cart-list">

      <div class="cart-item">
        <img src="headphoneimage.jpg">
        <div class="item-info">
          <h4>Wireless Headphones</h4>
          <p>₹3,999</p>
          <a href="products.html" class="btn">Remove</a>
        </div>
      </div>

      <div class="cart-item">
        <img src="speakerimage.jpg">
        <div class="item-info">
          <h4>Bluetooth Speaker</h4>
          <p>₹2,499</p>
          <a href="products.html" class="btn">Remove</a>
        </div>
      </div>

      <div class="cart-item">
        <img src="smartwatchimage.jpg">
        <div class="item-info">
          <h4>Smartwatch</h4>
          <p>₹4,999</p>
          <a href="products.html" class="btn">Remove</a>
        </div>
      </div>

    </div>

    <!-- Empty Cart Message -->
    <p class="empty">Your cart is currently empty. Add some amazing products!</p>

    <!-- Continue Shopping -->
    <a href="products.html" class="btn">Continue Shopping</a>
  </section>
</main>

<footer>© 2025 Amazon Clone - Made by Sehajnoor Kaur</footer>

</body>
</html>
